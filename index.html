<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A responsive JavaScript task manager with search, filters and localStorage." />
  <title>TaskFlow — JavaScript Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <section class="hero">
      <div>
        <p class="eyebrow">Portfolio Project</p>
        <h1>TaskFlow</h1>
        <p class="subtitle">A clean task manager built with vanilla JavaScript.</p>
      </div>

      <div class="stats" aria-label="Task statistics">
        <div class="stat-card">
          <span id="total-count">0</span>
          <small>Total</small>
        </div>
        <div class="stat-card">
          <span id="active-count">0</span>
          <small>Active</small>
        </div>
        <div class="stat-card">
          <span id="completed-count">0</span>
          <small>Done</small>
        </div>
      </div>
    </section>

    <section class="panel">
      <form id="task-form" class="task-form">
        <label class="sr-only" for="task-input">New task</label>
        <input
          id="task-input"
          type="text"
          maxlength="120"
          placeholder="What needs to be done?"
          autocomplete="off"
          required
        />
        <button class="primary-btn" type="submit">Add task</button>
      </form>

      <div class="toolbar">
        <div class="search-wrap">
          <label class="sr-only" for="search-input">Search tasks</label>
          <input id="search-input" type="search" placeholder="Search tasks..." />
        </div>

        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter-btn active" data-filter="all" type="button">All</button>
          <button class="filter-btn" data-filter="active" type="button">Active</button>
          <button class="filter-btn" data-filter="completed" type="button">Completed</button>
        </div>
      </div>

      <div class="list-header">
        <h2>Your tasks</h2>
        <button id="clear-completed" class="text-btn" type="button">Clear completed</button>
      </div>

      <ul id="task-list" class="task-list" aria-live="polite"></ul>

      <div id="empty-state" class="empty-state">
        <div class="empty-icon">✓</div>
        <h3>No tasks here</h3>
        <p>Add a task or change the current filter.</p>
      </div>
    </section>

    <footer>
      Built with HTML, CSS & JavaScript • Data saved in localStorage
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
